name: Autopilot Content Engine

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_LEVEL: INFO

          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDITS: ${{ secrets.REDDIT_SUBREDDITS }}
          REDDIT_FETCH_LIMIT: ${{ secrets.REDDIT_FETCH_LIMIT }}

          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_API_VERSION: v1.0
          THREADS_FETCH_LIMIT: 25
          THREADS_SEARCH_TERMS: ${{ secrets.THREADS_SEARCH_TERMS }}
          THREADS_SCRAPE_RSS_URL: ${{ secrets.THREADS_SCRAPE_RSS_URL }}

          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_ACCESS_TOKEN: ${{ secrets.BLOGGER_ACCESS_TOKEN }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY }}

          DRY_RUN: "false"
          REDDIT_TARGET_SUBREDDIT: ${{ secrets.REDDIT_TARGET_SUBREDDIT }}
          THREADS_HASHTAG_LIMIT: 6

          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
          CLUSTER_MIN_SAMPLES: 2
          CLUSTER_EPS: 0.35
          NEGATIVE_SENTIMENT_THRESHOLD: -0.15
          MIN_PROBLEM_KEYWORD_MATCHES: 1

          MAX_CLUSTERS_PER_RUN: 5
          MAX_CONTENT_PER_CLUSTER: 3
        run: python main.py run_once
